version: "3.9"

services:
  api:
    build: .
    container_name: requestsystem_api
    ports:
      - "8000:8000"
    environment:
      - MODE=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DB_PATH=/app/data/requestsystem.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s